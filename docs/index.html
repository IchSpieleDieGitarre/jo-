<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Kod QR do mojej strony</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs/qrcode.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 50px;
      background: #f4f4f4;
    }
    #qrcode {
      margin: 20px auto;
    }
    button {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 8px;
      border: none;
      background: #007acc;
      color: white;
    }
    button:hover {
      background: #005f99;
    }
  </style>
</head>
<body>
  <h1>Mój kod QR</h1>
  <p>Zeskanuj, aby wejść na stronę:</p>
  <div id="qrcode"></div>
  <button onclick="downloadQR()">📥 Pobierz kod QR</button>

  <script>
    // 🔗 TU podaj adres swojej strony z GitHub Pages:
    const link = "https://twoj-login.github.io/nazwa-projektu/";

    // Tworzymy QR
    const qr = new QRCode(document.getElementById("qrcode"), {
      text: link,
      width: 200,
      height: 200
    });

    // Funkcja pobierania
    function downloadQR() {
      // Szukamy wygenerowanego obrazka
      const img = document.querySelector("#qrcode img");
      if (img) {
        const a = document.createElement("a");
        a.href = img.src;
        a.download = "kod_qr.png";
        a.click();
      } else {
        alert("QR jeszcze się nie wygenerował!");
      }
    }
  </script>
</body>
</html>
